[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PBstats"
version = "0.2.0"
description = "Signal-aware analysis: diagnose, clean, transform and featurise time series for ML"
authors = [{ name = "Pallab Biswas", email = "pallabbiswas891@gmail.com" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["signal processing", "time series", "biosignals", "feature extraction", "machine learning", "ECG", "EEG"]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "pywavelets>=1.5",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = ["pytest", "black", "ruff", "mypy"]

[tool.setuptools.packages.find]
where = ["."]
include = ["PBstats*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Always test the source tree, never a stale installed copy.
pythonpath = ["."]
