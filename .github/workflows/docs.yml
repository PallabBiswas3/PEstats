name: docs

# Builds the documentation site and publishes it to GitHub Pages.
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[docs]"
      - name: Build (strict)
        shell: bash
        run: |
          set +e
          mkdocs build --strict 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          grep -E "WARNING|ERROR|Error" build.log | head -20 | while IFS= read -r line; do echo "::error::$line"; done
          exit $status
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
